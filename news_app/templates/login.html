{% extends 'base.html' %}
{% load static %}

{% block title %}Кіру - QazNews{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container-fluid">
        <h1>🔐 Сайтқа кіру</h1>
        <p>Қолданушы есептігіңізбен кіріңіз</p>
    </div>
</section>

<section class="auth-section">
    <div class="container-fluid">
        <div class="auth-container">
            {% if error_message %}
            <div class="error-alert">{{ error_message }}</div>
            {% endif %}
            
            <form class="auth-form" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Қолданушы аты</label>
                    <input type="text" id="username" name="username" placeholder="Қолданушы атыңыз" required>
                </div>
                <div class="form-group">
                    <label for="password">Құпия сөз</label>
                    <input type="password" id="password" name="password" placeholder="Құпия сөзіңіз" required>
                </div>
                <button type="submit" class="submit-btn">Кіру</button>
            </form>
            
            <div class="auth-links">
                <p>Есептік жоқ па? <a href="{% url 'register_page' %}">Тіркелу</a></p>
            </div>
        </div>
    </div>
</section>

<style>
.auth-section {
    padding: 40px 0;
    padding-bottom: 80px;
}

.auth-container {
    max-width: 400px;
    margin: 0 auto;
    background: var(--white);
    padding: 35px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.auth-form .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.auth-form label {
    font-size: 14px;
    font-weight: 600;
    color: var(--dark);
}

.auth-form input {
    padding: 14px 16px;
    border: 2px solid var(--grey);
    border-radius: var(--radius);
    font-size: 15px;
    transition: border-color 0.3s;
}

.auth-form input:focus {
    outline: none;
    border-color: var(--accent);
}

.auth-form .submit-btn {
    padding: 14px;
    background: var(--accent);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
    margin-top: 10px;
}

.auth-form .submit-btn:hover {
    background: var(--accent-hover);
}

.auth-links {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--grey);
}

.auth-links p {
    font-size: 14px;
    color: var(--text-light);
}

.auth-links a {
    color: var(--accent);
    font-weight: 600;
}

.auth-links a:hover {
    text-decoration: underline;
}

.error-alert {
    background: #fee;
    color: #c00;
    padding: 14px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    font-size: 14px;
}
</style>
{% endblock %}
